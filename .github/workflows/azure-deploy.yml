name: Azure CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test API
        run: |
          python - <<'PY'
          import app
          client = app.app.test_client()

          health = client.get("/api/health")
          assert health.status_code == 200, health.get_data(as_text=True)
          assert health.get_json()["database"] == "sqlite"

          config = client.get("/api/config")
          assert config.status_code == 200, config.get_data(as_text=True)
          assert config.get_json()["totalProducts"] >= 20

          products = client.get("/api/products?page=1&pageSize=5")
          assert products.status_code == 200, products.get_data(as_text=True)
          body = products.get_json()
          assert len(body["products"]) > 0
          print("Smoke tests passed")
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          startup-command: "gunicorn --bind=0.0.0.0:$PORT app:app"
